profile: paper
seed: 42

seed_data:
  yelp_businesses: 900
  emometa_pairs: 5000
  taobao_items: 4096
  taobao_users: 1200
  taobao_embed_dim: 64
  image_size: 224

encoder:
  text_backend: qwen2.5-7b
  vision_backend: vit_b16
  text_dim: 512
  vision_dim: 768
  patch_grid: 14
  item_dim: 128
  attention_dim: 64
  num_heads: 4
  top_k: 20
  keyword_topk: 3
  iou_threshold: 0.3

prototype:
  enabled: true
  num_prototypes: 3
  max_gate: 0.01

stage1:
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.01
  max_epochs: 14
  patience: 3
  emometa_subset: 5000

stage2:
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.01
  max_epochs: 14
  patience: 3
  lambda_score: 0.5
  variants: ["*"]

decoder:
  backend: qwen2.5-1.8b
  hidden_dim: 2048
  layers: 24
  heads: 16
  ff_mult: 4
  dropout: 0.05
  max_len: 512
  lora_rank: 8
  max_new_tokens: 96

eval:
  batch_size: 16
  candidates: 20
  neg_top_k: 200
  bpr_epochs: 5
  seeds: 5
  topk: [5, 10]
  human_sample: 200
  generation_samples: 500
  user_ranking_users: 600
  generation_users: 200
  transfer_users: 1200
  ranking_score_mode: generate

annotation:
  backend: qwen2.5-vl-72b
  accept_threshold: 0.95
  review_threshold: 0.7
  sample_review_rate: 0.2
  yelp_limit: 0
  emometa_limit: 0
